[project]
name = "pebblegpt"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "boto3>=1.43.75",
    "datasets>=5.0.1",
    "emoji>=2.15.0",
    "lm-eval>=0.4.12",
    "nltk>=3.9.1",
    "numpy>=2.2.6",
    "python-dotenv>=1.2.3",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "wandb>=0.28.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pebblegpt"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
